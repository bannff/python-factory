# Default Companion-X development stack: mirrors scripts/companion-x-ui.sh.
# It intentionally uses only the lightweight adapters selected in .env.
services:
  companion_x-api:
    build:
      context: ../..
      dockerfile: projects/companion_x/Dockerfile
    env_file:
      - .env
    environment:
      RUN_MODE: api
      FACTORY_API_HOST: 0.0.0.0
      FACTORY_API_PORT: 8000
      MCP_SERVER_NAME: companion-x
      MCP_ALLOWED_HOSTS: companion_x-api:*
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      AWS_CONFIG_FILE: /root/.aws/config
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Local development only: host-managed Ada credentials stay outside the
      # image/repository and are visible to the API as a read-only AWS profile.
      - ${HOME}/.aws:/root/.aws:ro
      - companion_x_kb:/app/chroma_data
      - companion_x_memory:/app/chroma_memory
      - companion_x_state:/app/.storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  companion_x-next:
    build:
      context: ../../frontends
      dockerfile: next-dashboard/Dockerfile
      target: runner
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_URL: http://companion_x-api:8000
      MCP_LOCAL_AUTH: ${MCP_LOCAL_AUTH:-true}
      MCP_LOCAL_AUTH_TOKEN: ${MCP_LOCAL_AUTH_TOKEN:?Set MCP_LOCAL_AUTH_TOKEN in projects/companion_x/.env}
    depends_on:
      companion_x-api:
        condition: service_healthy

volumes:
  companion_x_kb:
  companion_x_memory:
  companion_x_state:
