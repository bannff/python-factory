# One Linux container for the edge-device experiment rehearsal.
# This is a functional iPhone proxy, not iOS or a performance emulator.
# The experiment runner will start N separate SDK processes inside it.
name: edge-lab
image: python-factory/edge-lab:local
container_name: edge-lab
replace_existing: false
shell: /bin/sh
entrypoint: ["sleep", "infinity"]
platform: linux/arm64
device_target:
  family: iphone
  fidelity: linux_proxy
env_vars:
  PYTHONUNBUFFERED: "1"
