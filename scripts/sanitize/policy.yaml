# ---------------------------------------------------------------------------
# TIER 5 -- prose scrubs. Word-boundary, whole-token only.
# Replacements must be plausible public terms. A REDACTED_* sentinel in the
# OUTPUT is itself a verify failure (see forbid: placeholder_sentinel) --
# that is how `REDACTED_PLATFORM` shipped into published prose last time.
# ---------------------------------------------------------------------------
scrub_prose:
  # Prose only. Source code and structured contracts require explicit
  # replacements, anchored patches, or deletion so semantics cannot drift.
  extensions: [".md", ".txt"]
  filenames: []
  terms:
    # internal program / system names -> neutral equivalents
    - {from: "AutoSec",        to: "portfolio security"}
    - {from: "autosec",        to: "portfolio-security"}
    - {from: "Midway",         to: "SSO"}
    - {from: "midway",         to: "sso"}
    - {from: "mwinit",         to: "sso-login"}
    - {from: "Brazil",         to: "the internal build system"}
    - {from: "CloudAuth",      to: "OAuthProvider"}
    - {from: "cloudauth",      to: "oauth_provider"}
    - {from: "Odin",           to: "CredentialStore"}
    - {from: "Turtle",         to: "CredentialFile"}
    - {from: "Coral",          to: "RpcFramework"}
    - {from: "Veritas",        to: "the security graph"}
    - {from: "veritas",        to: "security-graph"}
    - {from: "SIPP",           to: "the findings store"}
    - {from: "Sipp",           to: "Findings-store"}
    - {from: "sipp",           to: "findings-store"}
    - {from: "VERITAS",        to: "SECURITY GRAPH"}
    - {from: "gated_garden",   to: "policy-gate"}
    - {from: "PetsProfileService", to: "ExampleService"}
    - {from: "PetsProfileWebsite", to: "ExampleWebsite"}
    - {from: "PetsProfile",    to: "ExampleService"}
    - {from: "SupplierShipmentAddress", to: "ExampleAddressService"}
    - {from: "PenPal",         to: "code-review-bot"}
    - {from: "penpal",         to: "code-review-bot"}
    - {from: "Taskei",         to: "the issue tracker"}
    - {from: "conduit",        to: "identity-provider"}
    - {from: "IibsAdminAccess", to: "AdminRole"}
    - {from: "art-support",    to: "support-account"}
    - {from: "art-agents",     to: "agents-account"}
    - {from: "art-ml",         to: "ml-account"}
    - {from: "art-platform",   to: "platform-infra"}
    # ART program framing -> neutral
    - {from: "ART platform",   to: "the deployment platform"}
    - {from: "ART multi-account", to: "multi-account"}
  # regex scrubs -- must be fully anchored, never bare substrings
  regex_terms:
    # Digit lookarounds, NOT \b. These IDs appear inside URL-encoded ARNs
    # ("...%3A647239283265") where the preceding char is a digit, so \b
    # never matches and the value survives. Found 2026-08 by manual grep
    # after fail-closed verify passed -- see the matching `forbid` rule.
    - {pattern: '(?<![0-9])420536192516(?![0-9])',  to: "123456789012"}
    - {pattern: '(?<![0-9])854929212007(?![0-9])',  to: "123456789012"}
    - {pattern: '(?<![0-9])647239283265(?![0-9])',  to: "123456789012"}
    - {pattern: 'code\.amazon\.com', to: "the internal code browser"}
    - {pattern: 'pipelines\.amazon\.com', to: "the internal pipeline console"}
    - {pattern: 'odin\.amazon\.com', to: "the internal credential store"}
    - {pattern: '\bbuilder_list_package_files\b', to: "repo_list_files"}
    - {pattern: '\bbuilder_read_package_file\b',  to: "repo_read_file"}
    - {pattern: '\bquery_veritas\b',  to: "graph_query"}
    - {pattern: '\bsipp_run_query\b', to: "security_list_findings_for_run"}
    - {pattern: '[\w.]+@amazon\.com', to: "dev@example.com"}
    # console URL naming the internal CodeCommit repo
    - {pattern: 'https://us-east-1\.console\.aws\.amazon(\.com)?/codesuite/codecommit/repositories/[\w-]+/browse',
       to: "https://github.com/bannff/python-software-factory"}

# ---------------------------------------------------------------------------
# FAIL-CLOSED VERIFY -- any hit in the OUTPUT tree fails the build.
# This is the step the 2026-05 pass lacked.
# ---------------------------------------------------------------------------
forbid:
  # Digit lookarounds, NOT \b -- \b fails inside URL-encoded ARNs.
  - {name: account_id,       pattern: '(?<![0-9])(420536192516|854929212007|647239283265)(?![0-9])'}
  # any 12-digit run that is not a known placeholder, as a catch-all for
  # account IDs we have not enumerated
  - {name: unknown_account_id, pattern: '(?<![0-9])(?!123456789012|000000000000|999999999999)[0-9]{12}(?![0-9])'}
  - {name: midway,           pattern: '(?i)\bmidway\b|\bmwinit\b'}
  - {name: internal_host,    pattern: '(?i)(code|pipelines|odin|tiny|w|issues|quip)[-.]amazon(\.com)?\b'}
  - {name: internal_email,   pattern: '@amazon\.com'}
  - {name: brazil,           pattern: '\bBrazil\b'}
  - {name: autosec,          pattern: '(?i)\bautosec\b'}
  - {name: aws_profile,      pattern: '\bart-(support|agents|ml|platform)\b'}
  - {name: auth_provider,    pattern: '\bIibsAdminAccess\b'}
  - {name: internal_service, pattern: '\b(CloudAuth|AAASecurityDaemon|register_with_aaa|OdinLocalRetriever|odin-get|CoralModule|turtleCredentialsPath)\b'}
  - {name: internal_program, pattern: '\b(VMR|LOAF|Taskei)\b'}
  - {name: excluded_brick,   pattern: '(?i)\b(veritas|sipp|gated_garden)\b'}
  - {name: internal_appsec,  pattern: '\b(PetsProfile\w*|SupplierShipmentAddress|penpal_report)\b'}
  # the sentinel-leak guard: placeholders must never reach published prose
  - {name: placeholder_sentinel, pattern: '\bREDACTED_[A-Z_]+\b'}
  # the 2026-05 corruption signature -- proves no bare-substring rule ran
  - {name: com_scrub_damage, pattern: '\b(repile|stposite|viewponents|graphpleted|infoponents|selfponents)\b|from ponents import'}
  # residue the rename tier can MASK: a scrubbed sentence still describing an
  # internal system. These phrases survive a name swap, so match the prose.
  - {name: internal_scale_claim, pattern: '6B\+ node|6 ?billion[- ]node'}
  - {name: internal_tooling_desc, pattern: 'Internal builder tooling|read code repos, search packages'}
  - {name: internal_cred_path,   pattern: '~/\.(midway|sso)/cookie|/root/\.(midway|sso)/cookie'}
  # policy must not have survived into the output
  - {name: policy_leak,      pattern: 'scripts/sanitize/policy\.yaml'}

# Documented exceptions. Each needs a reason; verify prints them so they
# stay visible rather than becoming invisible permanent carve-outs.
allow_exceptions:
  - path: components/ui/src/factory/ui/runtime/adapters/htmx_renderers_health.py
    pattern: '133146708735'
    reason: >
      Substring of the 15-digit CPython id() value 133146708735736 in a
      docstring about stripping Python object IDs from dict keys. Not an
      AWS account ID. Verified 2026-08.
  - path: frontends/next-dashboard/lib/timeline-sessions.ts
    pattern: '978307200000'
    reason: Epoch-milliseconds boundary for year 2001 in a comment.
  - path: docs/can_bus_datasets_catalog.md
    pattern: '(?i)\bautosec\b'
    reason: >
      Refers to the public AutoSec academic CAN-bus dataset corpus, not the
      internal program. Confirm the surrounding prose stays dataset-scoped.

