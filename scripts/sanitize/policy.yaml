  - scripts/sanitize/
  - scripts/sanitize_public.py
  # their tests exercise deleted tooling (and import the deleted package, which
  # structural verify flags as a dangling import); the drift checker is
  # sanitizer-only too, and it names the private policy path
  - scripts/test/test_sanitize_cli.py
  - scripts/test/test_sanitize_engine.py
  - scripts/test/test_sanitize_verify.py
  - scripts/test/test_sanitize_policy_drift.py
  - scripts/test/conftest.py
  - scripts/agentcore-ops.py
  - scripts/deploy-agentcore.sh

  # --- generated artifacts and machine/private deployment configuration ---
  - frontends/shared-renderer/tsconfig.tsbuildinfo
  - projects/companion_x/docker-compose.yml
  - .agents/steering/can-failure-prediction.md

  # --- workspace tooling / internal context ---
  - .kiro/
  - .beads/
  - .vscode/

  # --- excluded bricks: internal-only ---
  - components/veritas/
  - components/sipp/
  - components/gated_garden/
  - components/builder/
  # --- excluded brick: deprecated, not private (duplicates cache/graph/storage) ---
  - components/backend/

  # --- excluded sub-projects (companion_x is the only one published) ---
  - projects/veritas_standalone/
  - projects/circuitron/

  # --- REAL VULNERABILITY FINDINGS against named internal services.
  #     Highest-severity content in the tree. Never publish. ---
  - projects/companion_x/challenges/team-ask/
  - projects/companion_x/experiments/
  - projects/companion_x/runs/
  - projects/companion_x/.code-cache/

  # --- internal graph contents (~27 MB of Neo4j + a-mem dumps) ---
