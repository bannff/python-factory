# Sanitization policy for the public python-software-factory mirror.
#
# ############################################################################
# #  THIS FILE MUST NEVER BE PUBLISHED.                                      #
# #  It enumerates internal identifiers. Publishing it repeats the mistake   #
# #  of .SANITIZATION_MANIFEST.md, which handed readers a map of exactly     #
# #  what to hunt for. The `delete_paths` tier below deletes this directory  #
# #  from the output tree, and `forbid` fails the build if it survives.      #
# ############################################################################
#
# Tiers, applied in order:
#   1. delete_paths    -- whole trees / exact files removed
#   2. replace_files   -- ship a clean hand-authored replacement for a path
#   3. patches         -- explicit anchored find/replace; FAILS LOUD if the
#                         anchor is missing, so the policy cannot silently rot
#                         as the private tree evolves
#   4. rename_symbols  -- identifier-level rename, token-aware (never touches
#                         string literals or comments)
#   5. scrub_prose     -- word-boundary whole-token replacement, restricted to
#                         prose file types
#
# Then: regenerate BRICKS_INDEX, strip pyproject brick maps, and run verify.
#
# HARD RULE learned from the 2026-05 pass: no rule may match a bare substring.
# That pass deleted every literal ".com", which corrupted 200 code sites
# (re.compile -> repile, view.components -> viewponents, st.composite ->
# stposite, agent.graph.completed -> agent.graphpleted) and left the mirror
# unable to even collect tests. Every pattern here is anchored.

version: 4
generated_for: github.com/bannff/python-software-factory

# ---------------------------------------------------------------------------
# TIER 1 -- path deletions
# ---------------------------------------------------------------------------
delete_paths:
