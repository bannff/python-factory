        new: ""
      - old: "from .defaults_recon_graph_only import RECON_GRAPH_ONLY\n"
        new: ""
      - old: "from .defaults_recon_hybrid import RECON_HYBRID_GRAPH, RECON_HYBRID_SWARMS\n"
        new: ""
      - old: "from .defaults_redteam_meta_graph import REDTEAM_PIPELINE_GRAPHS, REDTEAM_PIPELINE_SWARMS\n"
        new: ""
      - old: "from .defaults_redteam_setup import SETUP_SWARMS\n"
        new: ""
      - old: "    PENTEST_SWARMS + AWS_PENTEST_SWARMS + REDTEAM_SWARMS + SETUP_SWARMS\n"
        new: "    PENTEST_SWARMS + AWS_PENTEST_SWARMS + REDTEAM_SWARMS\n"
      - old: "    + DAST_IDOR_HYBRID_SWARMS + RECON_HYBRID_SWARMS\n"
        new: "    + DAST_IDOR_HYBRID_SWARMS\n"
      - old: "    SAST_HYBRID_GRAPH, DAST_IDOR_HYBRID_GRAPH, RECON_GRAPH_ONLY,\n    RECON_HYBRID_GRAPH, SANDBOX_GRAPH_ONLY, SANDBOX_HYBRID_GRAPH,\n"
        new: "    SAST_HYBRID_GRAPH, DAST_IDOR_HYBRID_GRAPH,\n    SANDBOX_GRAPH_ONLY, SANDBOX_HYBRID_GRAPH,\n"
      - old: "    REDTEAM_GRAPHS + RECON_GRAPHS + SANDBOX_GRAPHS + REDTEAM_PIPELINE_GRAPHS\n"
        new: "    REDTEAM_GRAPHS + SANDBOX_GRAPHS\n"
      - old: "    SECURITY_SWARMS + REDTEAM_PIPELINE_SWARMS + EXPERIMENT_SWARMS\n"
        new: "    SECURITY_SWARMS + EXPERIMENT_SWARMS\n"

  - path: components/agent/src/factory/agent/registry/defaults_redteam_graph.py
    edits:
      - old: "from .defaults_redteam_swarms import RT_FOCUSED_SWARMS\n"
        new: ""
      - old: "REDTEAM_SWARMS: list[dict] = RT_FOCUSED_SWARMS"
        new: "REDTEAM_SWARMS: list[dict] = []"

  - path: components/agent/src/factory/agent/registry/factories.py
    edits:
      - old: "    if name == \"recon\":\n        from .defaults_recon_graph import build_recon_tasks\n        # ctx ignored — recon factory is a pure constant\n        return lambda _ctx: build_recon_tasks()\n"
        new: ""

  # This package re-exports its submodules for their registration side effects.
  # Tier 1 deletes metrics/mcp/ingestion.py, so the package must not import it
