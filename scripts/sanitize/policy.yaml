  - components/agent/test/factory/agent/test_factories_recon_edge_properties.py
  - components/agent/test/factory/agent/test_sandbox_label_consistency.py
  - components/agent/test/factory/agent/test_factories_sandbox_setup_qa.py
  - components/agent/test/factory/agent/test_graph_workflow_configs.py
  - components/agent/test/factory/agent/test_redteam_pipeline_meta.py
  - components/agent/test/factory/agent/test_no_cypher_in_registry.py
  - components/agent/src/factory/agent/scripts/smoke_test_node.py
  - bases/api/test/factory/api/test_aws_profile_promotion.py

  # NOTE: some targets below are no longer tracked -- either never tracked in
  # the private tree, or removed upstream. `git archive` already excludes
  # them; they stay listed as defence in depth in case they are ever committed
  # again. Every such no-op is declared in `expected_absent` below, so the
  # runtime report can tell an expected no-op apart from real policy rot.
  #
  # ROOT-CAUSE CLASS (issue #59): the sanitizer builds its tree with
  # `git archive` (scripts/sanitize_public.py:export_head), i.e. TRACKED FILES
  # ONLY. Every entry in this policy -- delete_paths, replace_files, patches,
  # allow_exceptions, structural.pyproject_files -- may therefore reference a
  # tracked path only. Gitignored, compiled and generated files are invisible
  # to it: a patch target in `lib/` output or a delete target in a build
  # directory silently rots. `scripts/test/test_sanitize_policy_drift.py`
  # asserts this for every entry.

  # --- seeded KB store holding real internal documents (Signal Landscape,
  #     internal risk data, internal ticket refs). Local dev data, referenced
  #     by no code. Delete rather than scrub. ---
