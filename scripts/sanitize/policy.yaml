  # --- internal-recon / service-mock feature excision (Option A).
  #     These are not name leaks -- the file CONTENT is the sensitive part:
  #     live Veritas Cypher schema, and a detection manual enumerating
  #     internal integration code signatures. Not sanitizable by renaming. ---
  - components/agent/src/factory/agent/registry/defaults_recon_graph.py
  - components/agent/src/factory/agent/registry/defaults_recon_graph_only.py
  - components/agent/src/factory/agent/registry/defaults_recon_hybrid.py
  - components/agent/src/factory/agent/registry/defaults_redteam_meta_graph.py
  - components/agent/src/factory/agent/registry/defaults_redteam_setup.py
  - components/agent/src/factory/agent/registry/defaults_redteam_swarms.py
  - components/agent/src/factory/agent/registry/redteam_code_discovery_addenda.py
  - components/agent/src/factory/agent/registry/redteam_sandbox_resources.py
  - components/agent/src/factory/agent/registry/redteam_service_mocks.py

  # --- skills scoped to internal recon ---
