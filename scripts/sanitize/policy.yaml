  - .agents/recipes/metrics-monitoring.md

  # Delete rather than inventing a public identity for private fleet doctrine.
  - .agents/steering/relativix-fleet-intelligence.md

delete_exact:
  # tracked despite being in .gitignore:84 -- gitignore does not untrack
  - .sesskey

# delete_paths entries that are legitimately no longer tracked: `git archive`
# never contains them, so their deletion is an expected no-op rather than a
# sign the policy rotted. Anything NOT declared here that disappears from the
# tracked tree is real drift and is reported as an error (and fails
# scripts/test/test_sanitize_policy_drift.py).
expected_absent:
  # never tracked: local tooling state, build output, disposable caches
  - {path: .vscode/, reason: editor state, untracked in the private tree}
  - {path: .kiro/, reason: local Kiro steering state, untracked}
  - {path: projects/circuitron/, reason: personal project, untracked}
  - {path: projects/companion_x/.code-cache/, reason: disposable code cache, untracked}
  - {path: frontends/shared-renderer/tsconfig.tsbuildinfo, reason: tsc incremental build output, never tracked}
  # removed from the private tree: excluded bricks keep their delete entry as
  # defence in depth in case they are ever committed again
  - {path: components/veritas/, reason: excluded brick, already removed}
  - {path: components/sipp/, reason: excluded brick, already removed}
  - {path: components/gated_garden/, reason: excluded brick, already removed}
  - {path: projects/veritas_standalone/, reason: excluded sub-project, already removed}
  - {path: .agents/skills/veritas-recon/, reason: internal-recon skill, already removed}
  - {path: components/metrics/test/factory/metrics/test_ingestion_properties.py, reason: bound to the deleted metrics ingestion module}
  - {path: components/agent/test/factory/agent/test_no_cypher_in_registry.py, reason: bound to the deleted recon registry}
  - {path: components/agent/src/factory/agent/scripts/smoke_test_node.py, reason: internal graph smoke script, already removed}

