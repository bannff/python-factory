  - path: components/metrics/src/factory/metrics/mcp/__init__.py
    edits:
      - old: "from . import authoring, deterministic, deterministic_stats, ingestion, operational, prompts, resources, seed"
        new: "from . import authoring, deterministic, deterministic_stats, operational, prompts, resources, seed  # noqa: F401"
      - old: '"deterministic_stats", "ingestion", "operational"'
        new: '"deterministic_stats", "operational"'

  - path: components/metrics/src/factory/metrics/server.py
    edits:
      - old: "from .mcp import authoring, deterministic, deterministic_stats, ingestion, operational, prompts, resources, seed"
        new: "from .mcp import authoring, deterministic, deterministic_stats, operational, prompts, resources, seed"
      - old: "    ingestion.register(registry, runtime)\n"
        new: ""

